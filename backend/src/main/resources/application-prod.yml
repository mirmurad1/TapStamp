# Production. ProdSafetyGuard başlanğıcda konfiqurasiyanı yoxlayır və təhlükəli dəyərlərdə tətbiqi dayandırır.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    cookie-secure: true
    hsts-enabled: true
  notifications:
    sms-provider: ${APP_SMS_PROVIDER:http}
    mail-provider: ${APP_MAIL_PROVIDER:smtp}
  tenancy:
    provisioner:
      # Prod-da yeni şirkət ayrıca, birdəfəlik əmrlə yaradılır (README → tenant qoşulması)
      enabled: ${APP_PROVISIONING_ENABLED:false}

logging:
  structured:
    format:
      # Strukturlaşdırılmış JSON loglar (ECS formatı)
      console: ecs
  level:
    root: INFO
