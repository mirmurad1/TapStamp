# Yalnız lokal inkişaf mühiti. Prod-da bu profil aktiv olarsa tətbiq başlamır (ProdSafetyGuard).
spring:
  config:
    # Docker-siz işə salanda sirlər layihənin kökündəki .env faylından oxunur (scripts/gen-secrets ilə yaradılır)
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    # *.localhost domenlərində HSTS brauzerin bütün localhost ünvanlarına təsir edir
    hsts-enabled: false
  dev:
    simulator-enabled: true
    seed-enabled: ${DEV_SEED_ENABLED:true}

logging:
  level:
    az.cafeloyalty: DEBUG
