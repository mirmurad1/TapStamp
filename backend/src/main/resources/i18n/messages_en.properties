# Backend messages — English (UTF-8).
# Arqumentli mesajlarda apostrof iki dəfə yazılmalıdır ('') — MessageFormat qaydası.

# --- Errors (Problem Details) ---
error.VALIDATION_FAILED.title=Some details need fixing
error.VALIDATION_FAILED.detail=Please check the highlighted fields and try again.
error.MALFORMED_REQUEST.title=We could not read the request
error.MALFORMED_REQUEST.detail=The request format is invalid.
error.UNAUTHENTICATED.title=Please sign in
error.UNAUTHENTICATED.detail=Sign in to your account to continue.
error.FORBIDDEN.title=Access denied
error.FORBIDDEN.detail=You do not have permission to do this.
error.CSRF_INVALID.title=Security check failed
error.CSRF_INVALID.detail=Please refresh the page and try again.
error.NOT_FOUND.title=Not found
error.NOT_FOUND.detail=We could not find what you were looking for.
error.METHOD_NOT_ALLOWED.title=Action not supported
error.METHOD_NOT_ALLOWED.detail=This request is not supported here.
error.UNSUPPORTED_MEDIA_TYPE.title=Unsupported format
error.UNSUPPORTED_MEDIA_TYPE.detail=The request content type is not supported.
error.PAYLOAD_TOO_LARGE.title=Request too large
error.PAYLOAD_TOO_LARGE.detail=The data you sent is larger than allowed.
error.RATE_LIMITED.title=Please wait a moment
error.RATE_LIMITED.detail=Too many requests. Please try again shortly.
error.TENANT_UNAVAILABLE.title=Service temporarily unavailable
error.TENANT_UNAVAILABLE.detail=This cafe loyalty service is not available right now. Please try again later.
error.SESSION_EXPIRED.title=Session expired
error.SESSION_EXPIRED.detail=For your security, your session has ended. Please sign in again.
error.LOGIN_FAILED.title=Sign-in failed
error.LOGIN_FAILED.detail=Incorrect email or password.
error.LOGIN_TEMPORARILY_BLOCKED.title=Sign-in temporarily blocked
error.LOGIN_TEMPORARILY_BLOCKED.detail=Too many failed attempts. Please try again in a few minutes.
error.MFA_INVALID.title=Invalid code
error.MFA_INVALID.detail=Check the code in your authenticator app or your recovery code and try again.
error.MFA_ALREADY_ENABLED.title=Two-step verification is already on
error.MFA_ALREADY_ENABLED.detail=Two-step verification is already set up for your account.
error.STEP_UP_REQUIRED.title=Confirmation required
error.STEP_UP_REQUIRED.detail=Enter the code from your authenticator app again to continue.
error.PASSWORD_POLICY_VIOLATION.title=Password does not meet the requirements
error.PASSWORD_POLICY_VIOLATION.detail=Choose a password of at least 12 characters that is hard to guess.
error.CURRENT_PASSWORD_INVALID.title=Current password is incorrect
error.CURRENT_PASSWORD_INVALID.detail=Enter your current password correctly.
error.TOKEN_INVALID.title=Link is invalid
error.TOKEN_INVALID.detail=The link has expired or has already been used. Please request a new one.
error.ALREADY_EXISTS.title=Already exists
error.ALREADY_EXISTS.detail=A record with these details already exists.
error.PROVISIONING_DISABLED.title=Company creation is disabled
error.PROVISIONING_DISABLED.detail=Creating companies is disabled on this server. Use the command line instead.
error.PHONE_INVALID.title=Invalid phone number
error.PHONE_INVALID.detail=Enter your mobile number, for example: 050 123 45 67.
error.PHONE_REGION_NOT_ALLOWED.title=Numbers from this country are not accepted
error.PHONE_REGION_NOT_ALLOWED.detail=This cafe's loyalty programme only accepts mobile numbers from permitted countries.
error.OTP_INVALID.title=Invalid code
error.OTP_INVALID.detail=Check the 6-digit code from the SMS and try again.
error.OTP_EXPIRED.title=The code has expired
error.OTP_EXPIRED.detail=Please request a new code.
error.OTP_ATTEMPTS_EXCEEDED.title=Too many wrong attempts
error.OTP_ATTEMPTS_EXCEEDED.detail=This code can no longer be used. Request a new code a bit later.
error.CONSENT_REQUIRED.title=Consent required
error.CONSENT_REQUIRED.detail=To continue, accept the privacy policy and the terms of use.
error.REFRESH_RACE.title=Session is being refreshed
error.REFRESH_RACE.detail=Please repeat the request.
error.CUSTOMER_BLOCKED.title=Account blocked
error.CUSTOMER_BLOCKED.detail=Your account has been blocked. Please contact the cafe for details.
error.INTERNAL_ERROR.title=Something went wrong
error.INTERNAL_ERROR.detail=An unexpected error occurred. Please try again shortly.

