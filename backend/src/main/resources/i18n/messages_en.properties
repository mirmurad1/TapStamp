# --- Email templates (with arguments: write apostrophes as '') ---
mail.passwordReset.subject=Reset your password
mail.passwordReset.body=Hello!\n\nWe received a request to reset your password. Open this link to set a new one:\n{0}\n\nThe link is valid for {1} minutes and can be used only once.\nIf you did not request this, ignore this email — your password will not change.
mail.passwordChanged.subject=Your password was changed
mail.passwordChanged.body=Hello!\n\nThe password for your account was just changed, and sessions on all other devices were signed out.\nIf this was not you, contact your company owner or platform support immediately.
mail.invitation.subject={0} — invitation to join the team
mail.invitation.body=Hello!\n\nYou have been invited to the {0} loyalty dashboard. Open this link to create your account:\n{1}\n\nThe invitation is valid for {2} hours. If you were not expecting it, ignore this email.

# --- SMS templates (with arguments; must fit one segment: 160 GSM-7 characters) ---
sms.otp={0} code: {1}. Do not share it.
sms.otpShort=Code: {0}. Do not share it.
