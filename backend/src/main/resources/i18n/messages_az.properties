mail.passwordReset.subject=Şifrənin bərpası
mail.passwordReset.body=Salam!\n\nŞifrənizi bərpa etmək üçün sorğu aldıq. Yeni şifrə təyin etmək üçün linki açın:\n{0}\n\nLink {1} dəqiqə etibarlıdır və yalnız bir dəfə istifadə oluna bilər.\nSorğunu siz göndərməmisinizsə, bu məktubu nəzərə almayın — şifrəniz dəyişməyəcək.
mail.passwordChanged.subject=Şifrəniz dəyişdirildi
mail.passwordChanged.body=Salam!\n\nHesabınızın şifrəsi indicə dəyişdirildi, digər bütün cihazlarda sessiyalar bağlandı.\nBunu siz etməmisinizsə, dərhal şirkətin sahibi və ya platforma dəstəyi ilə əlaqə saxlayın.
mail.invitation.subject={0} — komandaya dəvət
mail.invitation.body=Salam!\n\nSizi {0} loyallıq panelinə dəvət etdilər. Hesab yaratmaq üçün linki açın:\n{1}\n\nDəvət {2} saat etibarlıdır. Dəvət gözləmirdinizsə, bu məktubu nəzərə almayın.
