# --- Шаблоны писем (с аргументами: апостроф пишется как '') ---
mail.passwordReset.subject=Восстановление пароля
mail.passwordReset.body=Здравствуйте!\n\nМы получили запрос на восстановление пароля. Чтобы задать новый пароль, откройте ссылку:\n{0}\n\nСсылка действительна {1} мин. и может быть использована только один раз.\nЕсли вы не отправляли запрос, проигнорируйте это письмо — пароль не изменится.
mail.passwordChanged.subject=Ваш пароль изменён
mail.passwordChanged.body=Здравствуйте!\n\nПароль вашей учётной записи только что изменён, сеансы на всех остальных устройствах завершены.\nЕсли это были не вы, немедленно свяжитесь с владельцем компании или поддержкой платформы.
mail.invitation.subject={0} — приглашение в команду
mail.invitation.body=Здравствуйте!\n\nВас пригласили в панель программы лояльности {0}. Чтобы создать учётную запись, откройте ссылку:\n{1}\n\nПриглашение действительно {2} ч. Если вы его не ожидали, проигнорируйте письмо.

