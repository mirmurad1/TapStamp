<!-- Maket v3: trendsolutions.az şirkət saytı (AZ/EN/RU). TrendStamp ayrıca məhsul bölməsidir. Əlaqə məlumatları yer tutucudur. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter Tight (başlıqlar) və Inter (mətn): Azərbaycan (ə, ğ, ş) və kiril hərflərini tam dəstəkləyir -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A1226; --night-line:rgba(255,255,255,.12);
  --paper:#F4F6F9; --paper-2:#EBEEF3; --card:#FFFFFF; --ink:#0E1830; --ink-2:#53607A; --line:#DDE3EB;
  --violet:#1F9AAA; --violet-ink:#127280; --teal-logo:#4CC3D0; --mint:#2EE6A8;
  --display:"Inter Tight","Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--body);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;font:600 16px var(--body);text-decoration:none;border:0;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.mint{background:var(--mint);color:var(--night)}
.btn.mint:hover{background:#5ff0bf}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px var(--night-line)}
.btn.ghost:hover{background:rgba(255,255,255,.14)}

/* ===== Tünd bloklar (şirkət girişi və TrendStamp) ===== */
.dark{background:var(--night);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.dark::before{content:"";position:absolute;inset:0;z-index:-1;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;
  mask-image:radial-gradient(ellipse 80% 70% at 70% 40%,#000 30%,transparent 75%)}
.glow{position:absolute;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55}
.glow.a{width:520px;height:520px;background:var(--violet);right:-120px;top:-140px;animation:drift 14s ease-in-out infinite alternate}
.glow.b{width:380px;height:380px;background:#1EC08B;right:220px;top:280px;opacity:.35;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,50px) scale(1.1)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px;font:800 18px var(--display);text-decoration:none;letter-spacing:-.02em}
.brand{gap:12px}
.brand .mark{width:48px;height:34px;color:var(--teal-logo);flex:none}
.brand .bt{display:flex;flex-direction:column;line-height:1}
.brand .bt b{font:800 17px var(--display);letter-spacing:.02em}
.brand .bt small{font:500 9.5px var(--body);letter-spacing:.28em;margin-top:3px;opacity:.85}
footer .brand .mark{color:var(--violet)}
.nav{display:flex;align-items:center;gap:6px;font-weight:500;font-size:15px}
.nav>a:not(.btn){text-decoration:none;color:rgba(255,255,255,.72);padding:8px 12px;border-radius:999px}
.nav>a:not(.btn):hover{color:#fff;background:rgba(255,255,255,.06)}
.nav .btn{min-height:40px;padding:0 18px;font-size:14.5px;margin-left:6px}
.lang{display:flex;border-radius:999px;padding:3px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--night-line);margin-left:6px}
.lang button{border:0;background:none;font:600 12.5px var(--body);padding:5px 9px;border-radius:999px;color:rgba(255,255,255,.65);cursor:pointer}
.lang button:hover{color:#fff}
.lang button[aria-pressed=true]{background:#fff;color:var(--night)}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:112px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--night-line);font-size:14px;color:rgba(255,255,255,.82);text-decoration:none}
.pill b{background:var(--mint);color:var(--night);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
h1{margin-top:28px;font-weight:800;font-size:clamp(40px,6vw,74px);line-height:1.04;letter-spacing:-.025em}
.grad{background:linear-gradient(100deg,#fff 5%,#8FDCE4 50%,var(--mint) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:24px;max-width:31em;color:rgba(255,255,255,.7);font-size:19px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}

/* Girişin sağ tərəfi: istiqamət kartları */
.what{display:grid;gap:14px;width:min(100%,400px);justify-self:end}
.w-card{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:24px;text-decoration:none;color:#fff;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .25s,background .25s}
a.w-card:hover{transform:translateX(-6px);background:rgba(255,255,255,.12)}
.w-card:nth-child(2){margin-left:-40px}
.w-card b{display:block;font:700 18px var(--display);letter-spacing:-.02em}
.w-card small{color:rgba(255,255,255,.62);font-size:14px}
.w-ico{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--violet)}
.w-ico.mint{background:var(--mint);color:var(--night)}
.w-ico svg{width:22px;height:22px}
.w-card.soon{opacity:.55;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}

/* ===== Açıq bölmələr ===== */
section{padding:112px 0}
.kicker{font-weight:600;color:var(--violet-ink);font-size:15px}
.kicker.light{color:var(--mint)}
h2{margin-top:10px;font-weight:800;font-size:clamp(30px,3.9vw,48px);line-height:1.1;letter-spacing:-.02em;max-width:17em}
.sub{margin-top:16px;color:var(--ink-2);max-width:36em;font-size:18px}

.dirs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}
.dir{display:flex;flex-direction:column;padding:36px;border-radius:28px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-decoration:none;transition:transform .25s}
.dir:hover{transform:translateY(-4px)}
.dir svg{width:30px;height:30px;color:var(--violet)}
.dir h3{margin-top:24px;font-weight:700;font-size:25px;line-height:1.2;letter-spacing:-.03em}
.dir p{margin-top:10px;color:var(--ink-2)}
.dir span{margin-top:24px;font-weight:600;color:var(--violet-ink)}
.dir.dk{background:var(--night);color:#fff;box-shadow:none}
.dir.dk p{color:rgba(255,255,255,.68)} .dir.dk svg,.dir.dk span{color:var(--mint)}

.custom{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start}
.list{display:grid;gap:12px}
.li{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:22px 24px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.li svg{width:24px;height:24px;color:var(--violet);margin-top:3px}
.li b{font-weight:600;font-size:18px}
.li p{color:var(--ink-2);font-size:16px;margin-top:2px}

/* ===== TrendStamp ===== */
.product{border-radius:48px 48px 0 0}
.product .hero{padding-top:96px;padding-bottom:96px}
.p-logo{display:flex;align-items:center;gap:10px;margin-top:14px;font:800 24px var(--display);letter-spacing:-.03em}
.p-logo i{width:28px;height:28px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 6px rgba(46,230,168,.18)}
.p-h{margin-top:20px;color:#fff;font-size:clamp(34px,4.8vw,58px);max-width:none}

.demo{position:relative;justify-self:center;width:min(100%,360px)}
.phone{border-radius:36px;padding:20px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 40px 80px -30px rgba(0,0,0,.6)}
.phone small{display:block;color:rgba(255,255,255,.62);font-size:13px}
.phone b{font:700 20px var(--display);letter-spacing:-.02em}
.wallet{margin-top:14px;border-radius:22px;background:linear-gradient(140deg,var(--violet),var(--violet-ink));padding:20px;position:relative;overflow:hidden}
.wallet::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);right:-60px;top:-90px}
.wallet .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:rgba(255,255,255,.88)}
.wallet .count{font:800 30px var(--display);color:#fff;letter-spacing:-.03em}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:16px 0 4px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.4);display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.8)}
.slot.on{background:#fff;border:0}
.slot.on::after{content:"";width:42%;height:42%;border-radius:50%;background:var(--violet)}
.slot.new{animation:land .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{from{transform:scale(2.4);opacity:0}}
.tap{margin-top:14px;width:100%;min-height:52px;border:0;border-radius:16px;background:#fff;color:var(--night);font:600 16px var(--body);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;padding:0 12px}
.tap:hover{background:#DDF3F5}
.tap svg{width:20px;height:20px;flex:none}
.chip{position:absolute;right:-18px;top:-24px;width:68px;height:68px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--night);font:800 13px var(--display);box-shadow:0 12px 34px -8px rgba(46,230,168,.7)}
.chip::before,.chip::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--mint);opacity:0}
.demo.pulse .chip::before{animation:ring .9s ease-out}
.demo.pulse .chip::after{animation:ring .9s .2s ease-out}
@keyframes ring{from{opacity:.8;transform:scale(.8)}to{opacity:0;transform:scale(1.7)}}
.caption{text-align:center;margin-top:14px;font-size:14px;color:rgba(255,255,255,.58)}

.product-body{background:var(--paper-2)}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(200px,auto);gap:16px;margin-top:56px}
.tile{background:var(--card);border-radius:28px;padding:30px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column}
.tile h3{font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.03em}
.tile p{margin-top:10px;color:var(--ink-2);font-size:16px}
.t-big{grid-column:span 4;grid-row:span 2;background:var(--night);color:#fff;box-shadow:none}
.t-big p{color:rgba(255,255,255,.68);max-width:28em}
.t-2{grid-column:span 2}
.t-3{grid-column:span 3}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto;padding-top:32px}
.steps div{border-radius:20px;padding:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--night-line)}
.steps span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--night);font:800 14px var(--display)}
.steps b{display:block;margin-top:14px;font-weight:600}
.steps small{display:block;margin-top:4px;color:rgba(255,255,255,.62);font-size:14px;line-height:1.45}
.big-num{margin-top:auto;padding-top:16px;font:800 56px/1 var(--display);letter-spacing:-.05em;color:var(--violet)}
.langs{margin-top:auto;padding-top:16px;display:flex;gap:8px}
.langs span{padding:6px 14px;border-radius:999px;background:var(--paper);font-weight:600;font-size:14px}
.gift{margin-top:auto;padding-top:16px;display:flex;gap:10px}
.gift>span{flex:1;border-radius:16px;padding:14px;background:linear-gradient(140deg,#E3F4F6,#E6FBF4);font-weight:600;font-size:15px}
.gift small{display:block;color:var(--ink-2);font-weight:400;font-size:13px}

.demo-sec{padding-bottom:112px}
.demo-box{background:var(--night);color:#fff;border-radius:40px;padding:64px;display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;position:relative;overflow:hidden;isolation:isolate}
.demo-box .glow.a{width:420px;height:420px;left:-160px;bottom:-200px;top:auto;right:auto}
.demo-box h2{color:#fff}
.demo-box .sub{color:rgba(255,255,255,.68)}
.perks{list-style:none;padding:0;margin-top:32px;display:grid;gap:14px}
.perks li{display:flex;gap:12px;color:rgba(255,255,255,.88)}
.perks svg{flex:none;width:22px;height:22px;color:var(--mint);margin-top:2px}
form{background:#fff;color:var(--ink);border-radius:28px;padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.f{display:grid;gap:6px;align-content:start}
.f.full{grid-column:1/-1}
.f>label,.f>.lbl{font-weight:600;font-size:14.5px}
.opt{font-weight:400;color:var(--ink-2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;min-height:50px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);background:#fff}
input.err{border-color:#E5484D}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-block;padding:9px 16px;border-radius:999px;background:var(--paper);font-size:15px;font-weight:500;border:1.5px solid transparent}
.chips input:checked+span{background:#E3F4F6;border-color:var(--violet);color:var(--violet-ink)}
.chips input:focus-visible+span{outline:3px solid var(--violet);outline-offset:2px}
form .btn{grid-column:1/-1;background:var(--night);color:#fff;min-height:54px}
form .btn:hover{background:var(--violet)}
.note{grid-column:1/-1;font-size:13.5px;line-height:1.5;color:var(--ink-2);text-align:center}
.done{grid-column:1/-1;text-align:center;padding:40px 8px}
.done i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--mint);animation:land .6s cubic-bezier(.2,1.6,.4,1)}
.done i svg{width:30px;height:30px;color:var(--night)}
.done h3{margin-top:18px;font-weight:700;font-size:23px;letter-spacing:-.02em}
.done p{margin-top:8px;color:var(--ink-2)}

.contact{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.ci{display:flex;flex-direction:column;padding:18px 24px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-decoration:none;min-width:240px;flex:1}
.ci small{color:var(--ink-2);font-size:13.5px}
.ci b{font-weight:600;font-size:18px}
a.ci:hover{box-shadow:0 0 0 1.5px var(--ink)}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--ink-2);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:960px){
  .nav>a:not(.btn){display:none}
  .hero{grid-template-columns:1fr;padding-top:32px;padding-bottom:88px;gap:56px}
  .what{justify-self:stretch;width:auto}
  .w-card:nth-child(2){margin-left:0}
  .dirs,.custom,.demo-box{grid-template-columns:1fr}
  .custom,.demo-box{gap:40px}
  .bento{grid-template-columns:1fr 1fr}
  .t-big{grid-column:1/-1;grid-row:auto}
  .t-2,.t-3{grid-column:span 1}
  .demo-box{padding:40px 24px;border-radius:32px}
  .product{border-radius:32px 32px 0 0}
  .product .hero{padding-top:64px;padding-bottom:64px}
  section{padding:80px 0}
}
@media (max-width:600px){
  .wrap{padding-left:16px;padding-right:16px}
  .nav .btn{display:none}
  .bento{grid-template-columns:1fr}
  .t-2,.t-3{grid-column:auto}
  .steps{grid-template-columns:1fr}
  .tile,.dir{padding:24px;border-radius:24px}
  form{grid-template-columns:1fr;padding:22px}
  .demo-box{padding:32px 16px}
  .lead{font-size:17px}
  .chip{right:8px}
}
/* ===== Scroll animasiyaları: element ekrana girəndə görünür, çıxanda yenidən gizlənir (hər iki istiqamətdə) ===== */
.rv{opacity:0;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .8s;transition-delay:calc(var(--i,0) * 90ms)}
.rv.up{transform:translateY(48px)}
.rv.down{transform:translateY(-32px)}
.rv.left{transform:translateX(-64px)}
.rv.right{transform:translateX(64px)}
.rv.zoom{transform:scale(.88);filter:blur(6px)}
.rv.tilt{transform:perspective(900px) rotateX(18deg) translateY(60px)}
.rv.in{opacity:1;transform:none;filter:none}
.w-card.soon.rv.in{opacity:.55}
/* Başlıqlar söz-söz qalxır */
.words .w{display:inline-block;opacity:0;transform:translateY(.6em) rotate(4deg);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--w) * 45ms)}
.words.in .w{opacity:1;transform:none}
/* Səhifənin yuxarısında scroll irəliləyişi */
.progress{position:fixed;inset:0 0 auto;height:3px;z-index:50;background:linear-gradient(90deg,var(--violet),var(--mint));transform-origin:0 50%;transform:scaleX(0)}
/* Paralaks elementləri JS ilə --py dəyişənindən hərəkət edir */
.px{translate:0 var(--py,0px)}
.steps div{transition:background .4s,box-shadow .4s}
.steps div.lit{background:rgba(46,230,168,.12);box-shadow:inset 0 0 0 1px rgba(46,230,168,.5)}

@media (prefers-reduced-motion:reduce){.rv,.words .w{opacity:1!important;transform:none!important;filter:none!important}.px{translate:none!important}*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Demo kart: işçi təsdiqi gözləmə halı */
.slot.pending{border:2px solid #fff;animation:pend 1s ease-in-out infinite}
@keyframes pend{50%{transform:scale(1.18);background:rgba(255,255,255,.25)}}
.demo.wait .tap{background:#DDF3F5;cursor:wait}
.demo.wait .tap svg{animation:pend 1s ease-in-out infinite}
/* Sakit animasiyalar: bölmələr yalnız yumşaq görünür, sürüşmə və bulanıqlıq yoxdur */
.rv.up,.rv.down,.rv.left,.rv.right,.rv.zoom,.rv.tilt{transform:translateY(14px);filter:none}
.rv{transition-duration:.6s;transition-delay:calc(var(--i,0) * 50ms)}
.px{translate:none!important}
/* Küncdə WhatsApp: yalnız ikon */
.wa{position:fixed;right:16px;bottom:16px;z-index:50;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#25D366;color:#fff;box-shadow:0 8px 24px rgba(14,24,48,.25);transition:transform .2s}
.wa:hover{transform:scale(1.06)}
.wa svg{width:28px;height:28px}
/* Telefonda: hero-dan aşağı düşəndə yuxarıda yığcam zolaq (loqo + Demo al) */
.mbar{display:none}
@media (max-width:600px){
  .mbar{display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:50;padding:8px 16px;background:rgba(10,18,38,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--night-line);transform:translateY(-100%);transition:transform .3s}
  .mbar.show{transform:none}
  .mbar .mark{width:34px;height:24px;color:var(--teal-logo)}
  .mbar .btn{min-height:36px;padding:0 16px;font-size:14.5px}
  .wa{width:48px;height:48px;right:12px;bottom:12px}
}

/* Müştərilərimiz */
.clients{list-style:none;padding:0;margin:32px 0 0;display:flex;flex-wrap:wrap;gap:16px}
.clients li{display:flex;align-items:center;gap:16px;padding:18px 26px 18px 18px;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.clients .mono{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--violet),var(--violet-ink));color:#fff;font:800 19px var(--display);letter-spacing:.02em;flex:none}
.clients b{display:block;font:700 19px var(--display);letter-spacing:-.01em}
.clients small{color:var(--muted,#5A6478);font-size:15px}
/* Telefon (.lite): qısa və yüngül animasiya, ağır effektlər yoxdur */
.lite .rv{transition:opacity .45s ease-out,transform .45s ease-out;transition-delay:calc(var(--i,0) * 40ms)}
.lite .rv:not(.in){transform:translateY(16px)}
.lite .phone{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.1)}

/* Real ekranlar: iki telefon və admin paneli */
.shots{display:grid;grid-template-columns:1fr 1fr 2.4fr;gap:24px;align-items:start;margin-top:40px}
.shots figure{margin:0}
.shots img{display:block;width:100%;height:auto;background:var(--card)}
.shot-phone img{aspect-ratio:390/700;object-fit:cover;object-position:top;border-radius:28px;box-shadow:0 0 0 8px var(--night),0 30px 60px -25px rgba(14,24,48,.45)}
.shot-admin img{border-radius:16px;box-shadow:0 0 0 1px var(--line),0 30px 60px -25px rgba(14,24,48,.35)}
.shots figcaption{margin-top:18px;font-size:15px;color:var(--muted,#5A6478);text-align:center}
@media (max-width:960px){.shots{grid-template-columns:1fr 1fr}.shot-admin{grid-column:1/-1}}
@media (max-width:600px){.shots{gap:16px}.shot-phone img{border-radius:20px;box-shadow:0 0 0 5px var(--night),0 20px 40px -20px rgba(14,24,48,.45)}.shots figcaption{font-size:14px}}

/* Müştəri loqosu: kvadrat fayldan ortadakı yazı zolağı göstərilir */
.clients .logo{width:128px;height:64px;object-fit:cover;object-position:center;border-radius:14px;flex:none}

</style>

let lang='az';
const t=k=>T[lang][k]??T.az[k];
function applyLang(l){
  lang=T[l]?l:'az';
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t)});
  document.querySelectorAll('[data-t-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.tAria)));
  document.querySelectorAll('[data-t-alt]').forEach(el=>el.setAttribute('alt',t(el.dataset.tAlt)));
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  label.textContent=t(n>=TOTAL?'card.full':n===start?'card.tap':'card.added');
  try{localStorage.setItem('ts-lang',lang)}catch(e){}
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));

// Demo kart: hər toxunuşda bir möhür; kart dolanda hədiyyə, sonra yenidən başlayır
const TOTAL=6, start=3; let n=start;
const slots=document.getElementById('slots'), count=document.getElementById('count'),
      label=document.getElementById('tapLabel'), card=document.getElementById('demoCard');
function render(fresh){
  slots.innerHTML='';
  for(let i=0;i<TOTAL;i++){
    const s=document.createElement('span');
    s.className='slot'+(i<n?' on':'')+(fresh&&i===n-1?' new':'');
    if(i>=n) s.textContent=i===TOTAL-1?'🎁':i+1;
    slots.appendChild(s);
  }
  count.textContent=n+'/'+TOTAL;
}
document.getElementById('tap').addEventListener('click',()=>{
  if(n>=TOTAL){n=0;render();label.textContent=t('card.tap');return;}
  if(card.classList.contains('wait')) return;
  // Əvvəl işçi təsdiqi gözlənilir, sonra möhür düşür (real məhsulda olduğu kimi)
  card.classList.add('wait'); label.textContent=t('card.wait');
  slots.children[n].classList.add('pending');
  setTimeout(()=>{
    card.classList.remove('wait');
    n++; render(true);
    card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse');
    label.textContent=t(n===TOTAL?'card.full':'card.added');
  },1600);
});
render();

let saved=null; try{saved=localStorage.getItem('ts-lang')}catch(e){}
applyLang(saved||(navigator.language||'az').slice(0,2));

// ===== Animasiyalar =====
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Telefonda animasiya yüngül olur: başlıqlar sözlərə bölünmür, element ekrana çatmamış görünür və bir dəfə görünəndən
// sonra yenidən gizlənmir, paralaks yoxdur. Sürətli (inersiyalı) scroll-da ekranın boş və ya yarımçıq qalmasının qarşısını alır.
const mobile=matchMedia('(max-width: 768px), (pointer: coarse)').matches;
if(mobile) document.documentElement.classList.add('lite');
const bar=document.createElement('div'); bar.className='progress'; document.body.prepend(bar);

// Hansı element necə görünür: [selektor, növ, qardaşlar arasında pillə-pillə gecikmə]
const REVEAL=[
  ['.pill','down'],['.lead,.ctas','up'],['.what .w-card','right',1],
  ['.kicker','left'],['.sub','up'],
  ['.dir','tilt',1],['.li','right',1],
  ['.p-logo','left'],['.demo','zoom'],
  ['.tile','up',1],['.steps div','up',1],
  ['.perks li','left',1],['form','zoom'],['.ci','up',1],['footer .wrap','up']
];
REVEAL.forEach(([sel,kind,stagger])=>document.querySelectorAll(sel).forEach((el,i)=>{
  el.classList.add('rv',kind); if(stagger) el.style.setProperty('--i',i);
}));

// Başlıqları sözlərə bölür (dil dəyişəndə yenidən)
function splitWords(){
  document.querySelectorAll('h1,h2').forEach(h=>{
    let k=0;
    const walk=node=>[...node.childNodes].forEach(c=>{
      if(c.nodeType===3){
        const frag=document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(part=>{
          if(!part) return;
          if(/^\s+$/.test(part)){frag.append(part);return;}
          const s=document.createElement('span'); s.className='w'; s.style.setProperty('--w',k++); s.textContent=part; frag.append(s);
        });
        c.replaceWith(frag);
      } else if(c.nodeType===1 && c.classList.contains('grad')){c.classList.add('w'); c.style.setProperty('--w',k++);}
      else if(c.nodeType===1 && !c.classList.contains('w')) walk(c);
    });
    walk(h); h.classList.add('words');
  });
}

// Görünmə iki müşahidəçi ilə: element ekrana girəndə (aşağıdan 12% içəri) .in əlavə olunur, ekrandan 120 px uzaqlaşanda silinir.
// Sərhədlər arasındakı boşluq animasiyanın öz sürüşməsindən (48–64 px) böyükdür, ona görə kənarda dayananda
// element "gəlib-getmir"; aşağı və yuxarı scroll-da animasiya yenə təkrar oynayır.
const showIO=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting || e.target.classList.contains('in')) return;
  e.target.classList.add('in');
  if(mobile) showIO.unobserve(e.target);
  if(e.target.id==='demoCard') autoTap();
}),{threshold:0,rootMargin:mobile?'0px 0px 25% 0px':'0px 0px -12% 0px'});
const hideIO=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) e.target.classList.remove('in');
}),{threshold:0,rootMargin:'120px 0px 120px 0px'});
function observeAll(){document.querySelectorAll('.rv,.words').forEach(el=>{showIO.observe(el);if(!mobile) hideIO.observe(el)})}

// Demo kart görünəndə bir möhür özü düşür
let autoT; function autoTap(){clearTimeout(autoT); autoT=setTimeout(()=>{if(n<TOTAL) document.getElementById('tap').click()},700)}

// Paralaks və irəliləyiş xətti
const PX=[...document.querySelectorAll('.glow,.what,.demo .phone,.chip')];
PX.forEach(el=>el.classList.add('px'));
const steps=[...document.querySelectorAll('.steps div')];
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    const y=scrollY, max=document.documentElement.scrollHeight-innerHeight;
    bar.style.transform=`scaleX(${max>0?y/max:0})`;
    if(!reduce && !mobile){
      PX.forEach(el=>{
        const r=el.getBoundingClientRect(), c=(r.top+r.height/2-innerHeight/2);
        const k=el.classList.contains('glow')?-.25:el.classList.contains('chip')?-.18:-.08;
        // Sürüşmə ±40 px ilə məhdudlaşır, telefonda yalnız fon ləkələri hərəkət edir — kartlar düymələrin üstünə çıxmasın
        const v=(innerWidth<600 && !el.classList.contains('glow'))?0:Math.max(-40,Math.min(40,c*k));
        el.style.setProperty('--py',v.toFixed(1)+'px');
      });
      // Böyük kafeldəki addımlar scroll-a görə növbə ilə işıqlanır
      const big=document.querySelector('.t-big');
      if(big){const r=big.getBoundingClientRect(), p=(innerHeight*.75-r.top)/r.height;
        steps.forEach((s,i)=>s.classList.toggle('lit',p>.35+i*.18 && r.bottom>0));}
    }
    ticking=false;
  });
}
addEventListener('scroll',onScroll,{passive:true});
// Telefonda yığcam zolaq: hero-dan aşağı düşəndə görünür
const mbar=document.querySelector('.mbar');
const onBar=()=>mbar.classList.toggle('show',scrollY>480);
addEventListener('scroll',onBar,{passive:true}); onBar(); addEventListener('resize',onScroll);

if(!reduce){if(!mobile) splitWords(); observeAll();}
else document.querySelectorAll('.rv').forEach(el=>el.classList.add('in'));
onScroll();
// Dil dəyişəndə başlıqlar yenidən sözlərə bölünür
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(!reduce && !mobile){splitWords();observeAll();}}));

// Maketdə forma heç yerə göndərilmir: yalnız uğur vəziyyəti göstərilir
document.getElementById('demoForm').addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, req=[...f.querySelectorAll('[required]')];
  req.forEach(i=>i.classList.toggle('err',!i.value.trim()));
  const miss=req.find(i=>!i.value.trim());
  if(miss){miss.focus();return;}
  f.innerHTML='<div class="done"><i><svg><use href="#check"/></svg></i><h3 data-t="form.doneT"></h3><p data-t="form.doneP"></p></div>';
  f.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=t(el.dataset.t)});
});
</script>
</body>
</html>
