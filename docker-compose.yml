# Kafe Loyallıq — lokal mühit. İşə salmaq: README.md-dəki "Quraşdırma" bölməsinə bax.
# Sirlər .env faylından gəlir (scripts/gen-secrets ilə yaradılır); bu faylda heç bir sirr yoxdur.
name: cafe-loyalty

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env-də təyin olunmalıdır}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      DB_PLATFORM_OWNER_PASSWORD: ${DB_PLATFORM_OWNER_PASSWORD:?}
      DB_PLATFORM_APP_PASSWORD: ${DB_PLATFORM_APP_PASSWORD:?}
      DB_PROVISIONER_PASSWORD: ${DB_PROVISIONER_PASSWORD:?}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loyalty_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_PLATFORM_DOMAIN: ${APP_PLATFORM_DOMAIN:-platform.localhost}
      APP_SMS_PROVIDER: ${APP_SMS_PROVIDER:-console}
      APP_MAIL_PROVIDER: ${APP_MAIL_PROVIDER:-console}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_SMS_HTTP_URL: ${APP_SMS_HTTP_URL:-}
      APP_SMS_HTTP_API_KEY: ${APP_SMS_HTTP_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      APP_PROVISIONING_ENABLED: ${APP_PROVISIONING_ENABLED:-false}
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-true}
      DEV_SEED_ADMIN_PASSWORD: ${DEV_SEED_ADMIN_PASSWORD:-Kofe-Dev-Parol-2026}
      APP_CRYPTO_KEKS: ${APP_CRYPTO_KEKS:?}
      APP_CRYPTO_ACTIVE_KEK_ID: ${APP_CRYPTO_ACTIVE_KEK_ID:?}
      APP_PHONE_HMAC_KEY: ${APP_PHONE_HMAC_KEY:?}
      APP_OTP_PEPPER: ${APP_OTP_PEPPER:?}
      APP_REDEMPTION_CODE_KEY: ${APP_REDEMPTION_CODE_KEY:?}
      APP_DEV_SIMULATOR_KEY: ${APP_DEV_SIMULATOR_KEY:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PLATFORM_OWNER_PASSWORD: ${DB_PLATFORM_OWNER_PASSWORD:?}
      DB_PLATFORM_APP_PASSWORD: ${DB_PLATFORM_APP_PASSWORD:?}
      DB_PROVISIONER_PASSWORD: ${DB_PROVISIONER_PASSWORD:?}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data
      - edge

  frontend:
    build: ./frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      # Prod-da: "max-age=63072000; includeSubDomains". Dev-də boşdur (HSTS bütün *.localhost ünvanlarına təsir edir)
      NGINX_HSTS_HEADER: ${NGINX_HSTS_HEADER:-}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

volumes:
  pgdata:
  certbot-webroot:

networks:
  # Verilənlər bazası yalnız daxili şəbəkədədir (xaricə çıxışı yoxdur)
  data:
    internal: true
  edge:
