</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8.3a6 6 0 0 1 0 7.4M9.5 5.5a10 10 0 0 1 0 13M13 3a14 14 0 0 1 0 18"/></symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></symbol>
  <symbol id="web" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></symbol>
  <symbol id="mob" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></symbol>
  <symbol id="plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M6 7h12v4a6 6 0 0 1-12 0zM12 17v4"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></symbol>
  <!-- Trend Solutions loqosunun T işarəsi (xətlərdən qurulmuş T), rəngi currentColor ilə -->
  <symbol id="logo" viewBox="0 0 380 265" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter"><path d="M60 8H372V68M6 54H126M168 54V258H232M326 54H214V204"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<!-- Mətnlər data-t açarları ilə aşağıdakı lüğətdən (az/en/ru) yazılır -->
<div class="dark">
  <span class="glow a"></span><span class="glow b"></span>
  <header class="wrap top">
    <a class="brand" href="#" aria-label="Trend Solutions"><svg class="mark" aria-hidden="true"><use href="#logo"/></svg><span class="bt"><b>TREND</b><small>SOLUTIONS</small></span></a>
    <nav class="nav" data-t-aria="nav.label">
      <a href="#xidmetler" data-t="nav.services"></a>
      <a href="#trendstamp">TrendStamp</a>
      <a href="#demo" data-t="nav.demo"></a>
      <div class="lang" role="group" data-t-aria="nav.lang">
        <button type="button" data-lang="az">AZ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
      </div>
      <a class="btn mint" href="#elaqe" data-t="nav.contact"></a>
    </nav>
  </header>

  <div class="wrap hero">
    <div>
      <a class="pill" href="#trendstamp"><b data-t="hero.new"></b><span data-t="hero.pill"></span></a>
      <h1 data-t="hero.title"></h1>
      <p class="lead" data-t="hero.lead"></p>
      <div class="ctas">
        <a class="btn mint" href="#elaqe" data-t="hero.cta"></a>
        <a class="btn ghost" href="#xidmetler" data-t="hero.cta2"></a>
      </div>
    </div>
    <div class="what">
      <a class="w-card" href="#xidmetler"><span class="w-ico"><svg><use href="#web"/></svg></span><span><b data-t="w.custom"></b><small data-t="w.customSub"></small></span></a>
      <a class="w-card" href="#trendstamp"><span class="w-ico mint"><svg><use href="#nfc"/></svg></span><span><b>TrendStamp</b><small data-t="w.tapSub"></small></span></a>
      <div class="w-card soon"><span class="w-ico"><svg><use href="#plus"/></svg></span><span><b data-t="w.next"></b><small data-t="w.nextSub"></small></span></div>
    </div>
  </div>
</div>

<main>
<section id="mehsullar">
  <div class="wrap">
    <p class="kicker" data-t="dirs.kicker"></p>
    <h2 data-t="dirs.title"></h2>
    <div class="dirs">
      <a class="dir" href="#xidmetler"><svg><use href="#web"/></svg><h3 data-t="w.custom"></h3><p data-t="dirs.customText"></p><span data-t="dirs.more"></span></a>
      <a class="dir dk" href="#trendstamp"><svg><use href="#nfc"/></svg><h3 data-t="dirs.tapTitle"></h3><p data-t="dirs.tapText"></p><span data-t="dirs.tapMore"></span></a>
    </div>
  </div>
</section>

<section id="xidmetler" class="flush">
  <div class="wrap custom">
    <div>
      <p class="kicker" data-t="w.custom"></p>
      <h2 data-t="custom.title"></h2>
      <p class="sub" data-t="custom.sub"></p>
    </div>
    <div class="list">
      <div class="li"><svg><use href="#web"/></svg><div><b data-t="custom.webT"></b><p data-t="custom.webP"></p></div></div>
      <div class="li"><svg><use href="#mob"/></svg><div><b data-t="custom.mobT"></b><p data-t="custom.mobP"></p></div></div>
      <div class="li"><svg><use href="#plug"/></svg><div><b data-t="custom.intT"></b><p data-t="custom.intP"></p></div></div>
      <div class="li"><svg><use href="#shield"/></svg><div><b data-t="custom.supT"></b><p data-t="custom.supP"></p></div></div>
    </div>
  </div>
</section>

<!-- ===== TrendStamp məhsul bölməsi ===== -->
<div class="dark product" id="trendstamp">
  <span class="glow a"></span><span class="glow b"></span>
  <div class="wrap hero">
    <div>
      <p class="kicker light" data-t="tap.kicker"></p>
      <p class="p-logo"><i></i>TrendStamp</p>
      <h2 class="p-h" data-t="tap.title"></h2>
      <p class="lead" data-t="tap.lead"></p>
      <div class="ctas">
        <a class="btn mint" href="#demo" data-t="tap.cta"></a>
        <a class="btn ghost" href="#imkanlar" data-t="tap.cta2"></a>
      </div>
    </div>
    <div class="demo" id="demoCard">
      <div class="phone">
        <small data-t="card.company"></small>
        <b data-t="card.title"></b>
        <div class="wallet">
          <div class="row"><span data-t="card.rule"></span><span class="count" id="count">3/6</span></div>
          <div class="slots" id="slots"></div>
        </div>
        <button class="tap" id="tap" type="button"><svg><use href="#nfc"/></svg><span id="tapLabel"></span></button>
      </div>
      <div class="chip" aria-hidden="true">NFC</div>
      <p class="caption" data-t="card.caption"></p>
    </div>
  </div>
</div>

<div class="product-body">
<section id="imkanlar">
  <div class="wrap">
    <p class="kicker" data-t="feat.kicker"></p>
    <h2 data-t="feat.title"></h2>
    <p class="sub" data-t="feat.sub"></p>
    <div class="bento">
      <article class="tile t-big">
        <h3 data-t="feat.tapT"></h3>
        <p data-t="feat.tapP"></p>
        <div class="steps">
          <div><span>1</span><b data-t="feat.s1"></b><small data-t="feat.s1p"></small></div>
          <div><span>2</span><b data-t="feat.s2"></b><small data-t="feat.s2p"></small></div>
          <div><span>3</span><b data-t="feat.s3"></b><small data-t="feat.s3p"></small></div>
        </div>
      </article>
      <article class="tile t-2"><h3 data-t="feat.appT"></h3><p data-t="feat.appP"></p><div class="big-num">0 MB</div></article>
      <article class="tile t-2"><h3 data-t="feat.langT"></h3><p data-t="feat.langP"></p><div class="langs"><span>AZ</span><span>EN</span><span>RU</span></div></article>
      <article class="tile t-3">
        <h3 data-t="feat.giftT"></h3><p data-t="feat.giftP"></p>
        <div class="gift"><span><span data-t="feat.g1"></span><small data-t="feat.g1s"></small></span><span><span data-t="feat.g2"></span><small data-t="feat.g2s"></small></span></div>
      </article>
      <article class="tile t-3"><h3 data-t="feat.statT"></h3><p data-t="feat.statP"></p></article>
    </div>
  </div>
</section>

<!-- Real ekranlar: lokal demo şirkətindən çəkilib -->
<section id="ekranlar" class="flush">
  <div class="wrap">
    <p class="kicker" data-t="shots.kicker"></p>
    <h2 data-t="shots.title"></h2>
    <div class="shots">
      <figure class="shot-phone"><img src="/assets/img/app-card.png" width="390" height="844" loading="lazy" alt="" data-t-alt="shots.cardAlt"><figcaption data-t="shots.card"></figcaption></figure>
      <figure class="shot-phone"><img src="/assets/img/app-approval.png" width="390" height="844" loading="lazy" alt="" data-t-alt="shots.waitAlt"><figcaption data-t="shots.wait"></figcaption></figure>
      <figure class="shot-admin"><img src="/assets/img/admin-dashboard.png" width="1280" height="800" loading="lazy" alt="" data-t-alt="shots.adminAlt"><figcaption data-t="shots.admin"></figcaption></figure>
    </div>
  </div>
</section>

<!-- Müştərilərimiz: TrendStamp-dan istifadə edən bizneslər -->
<section id="musteriler" class="flush">
  <div class="wrap">
    <p class="kicker" data-t="clients.kicker"></p>
    <h2 data-t="clients.title"></h2>
    <ul class="clients">
      <li><img class="logo" src="/assets/img/hezz-point-logo.jpg" width="128" height="64" alt="" loading="lazy"><span><b>Həzz Point</b><small data-t="clients.hezz"></small></span></li>
    </ul>
  </div>
</section>

<div class="wrap demo-sec" id="demo">
  <div class="demo-box">
    <span class="glow a"></span>
    <div>
      <h2 data-t="demo.title"></h2>
      <p class="sub" data-t="demo.sub"></p>
      <ul class="perks">
        <li><svg><use href="#check"/></svg><span data-t="demo.p1"></span></li>
        <li><svg><use href="#check"/></svg><span data-t="demo.p2"></span></li>
        <li><svg><use href="#check"/></svg><span data-t="demo.p3"></span></li>
      </ul>
    </div>
    <form id="demoForm" novalidate>
      <div class="f"><label for="n" data-t="form.name"></label><input id="n" name="name" maxlength="100" autocomplete="name" required></div>
      <div class="f"><label for="p" data-t="form.phone"></label><input id="p" name="phone" type="tel" maxlength="30" inputmode="tel" placeholder="+994 50 000 00 00" autocomplete="tel" required></div>
      <div class="f full"><label for="c" data-t="form.company"></label><input id="c" name="company" maxlength="150" autocomplete="organization" required></div>
      <div class="f full" role="radiogroup" aria-labelledby="typeLbl"><span class="lbl" id="typeLbl" data-t="form.type"></span>
        <div class="chips">
          <label><input type="radio" name="type" value="cafe" checked><span data-t="form.cafe"></span></label>
          <label><input type="radio" name="type" value="restaurant"><span data-t="form.restaurant"></span></label>
          <label><input type="radio" name="type" value="beauty"><span data-t="form.beauty"></span></label>
          <label><input type="radio" name="type" value="barber"><span data-t="form.barber"></span></label>
          <label><input type="radio" name="type" value="carwash"><span data-t="form.carwash"></span></label>
          <label><input type="radio" name="type" value="other"><span data-t="form.other"></span></label>
        </div>
      </div>
      <div class="f full"><label for="b" data-t="form.branches"></label>
        <select id="b" name="branches"><option value="1">1</option><option value="2-5">2–5</option><option value="6+" data-t="form.many"></option></select>
      </div>
      <div class="f full"><label for="m"><span data-t="form.note"></span> <span class="opt" data-t="form.optional"></span></label><textarea id="m" name="note" maxlength="1000"></textarea></div>
      <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-err f full" id="formErr" role="alert" hidden></p>
      <button class="btn" type="submit" data-t="form.submit"></button>
      <p class="note" data-t="form.consent"></p>
    </form>
  </div>
</div>
</div>

<section id="elaqe">
  <div class="wrap">
    <h2 data-t="contact.title"></h2>
    <p class="sub" data-t="contact.sub"></p>
    <div class="contact">
      <a class="ci" href="mailto:info@trendsolutions.az"><small data-t="contact.email"></small><b>info@trendsolutions.az</b></a>
      <a class="ci" href="tel:+994102658701"><small data-t="contact.phone"></small><b>+994 10 265 87 01</b></a>
    </div>
  </div>
</section>
</main>
