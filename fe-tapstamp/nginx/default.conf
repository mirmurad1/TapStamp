# Frontend konteynerinin daxili nginx-i: yalnız statik fayllar və SPA marşrutlarının fallback-i.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # HTML faylları keşlənmir ki, yeni buraxılış dərhal görünsün
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /admin/index.html {
        add_header Cache-Control "no-cache" always;
    }
    # Service worker həmişə yenisi ilə yoxlanılır (köhnə versiyada ilişib qalmasın)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # Hash-li resurslar dəyişməz olduğu üçün uzunmüddətli keşlənir
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /admin {
        try_files $uri /admin/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
