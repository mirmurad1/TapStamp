# Ümumi konfiqurasiya. Sirlər burada YOXDUR — yalnız env dəyişənlərindən gəlir (.env.example-a bax).
spring:
  lifecycle:
    # Graceful shutdown-da başlanmış sorğular üçün ən çox gözləmə (docker stop_grace_period bundan uzundur)
    timeout-per-shutdown-phase: 30s
  application:
    name: tapstamp
  jackson:
    deserialization:
      # Naməlum JSON sahələri rədd edilir (mass assignment qorunması)
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  web:
    # Stack trace və daxili mesajlar istifadəçiyə heç vaxt göstərilmir
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
      whitelabel:
        enabled: false
  servlet:
    # Yalnız loqo yükləməsi multipart istifadə edir (fayl 1 MB-a qədər)
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
    encoding:
      charset: UTF-8
      # Yalnız sorğular: cavablarda məcburi charset şəkillərə də (image/png) əlavə olunardı; JSON onsuz da UTF-8-dir
      force-request: true
  flyway:
    # Miqrasiyalar DatabaseMigrator ilə idarə olunur (platforma + hər tenant bazası)
    enabled: false
  mail:
    # Yalnız APP_MAIL_PROVIDER=smtp olanda istifadə olunur
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  # Sıfır fasiləli deploy: dayan siqnalından sonra yeni sorğu qəbul olunmur, başlanmış sorğular bitirilir
  shutdown: graceful
  # nginx-in X-Forwarded-* başlıqları yalnız daxili şəbəkədəki proxy-dən qəbul olunur (Tomcat RemoteIpValve)
  forward-headers-strategy: native
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,platformDatabase
  health:
    # Əsas DataSource tenant marşrutlayıcısıdır; əvəzində platformDatabase indikatoru işləyir
    db:
      enabled: false
    # SMTP-nin əlçatmazlığı tətbiqi "hazır deyil" etməməlidir (email arxa planda göndərilir)
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
    path: /api/v1/openapi.json
  swagger-ui:
    enabled: false
    path: /api/v1/docs

app:
  default-language: az
  platform-domain: ${APP_PLATFORM_DOMAIN:platform.localhost}
  # Daxili endpoint-lər (certbot üçün TLS domen siyahısı) üçün sirr; boşdursa həmin endpoint-lər işləmir
  internal-token: ${APP_INTERNAL_TOKEN:}
  # NFC çipləri: hər şirkətdə ilk N çip pulsuzdur, qalanları pulludur (yalnız say aparılır)
  nfc:
    free-tags-per-tenant: ${APP_NFC_FREE_TAGS:1}
  security:
    cookie-secure: true
    hsts-enabled: true
  # Giriş kodlarının gündəlik SMS büdcəsi (qərar #53): şirkət — yalnız yeni nömrələrə (platforma şirkət üzrə dəyişə
  # bilir), platforma — bütün kodlar (sabit büdcə). 80% və 100%-də xəbərdarlıq — alert-email boşdursa yalnız audit/log.
  # Web push (qərar #54): VAPID açarları — scripts/gen-vapid-keys ilə yaradılır; boşdursa push söndürülür.
  # subject — push xidməti üçün əlaqə (mailto:), boşdursa APP_MAIL_FROM
  push:
    vapid-public-key: ${APP_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${APP_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${APP_PUSH_SUBJECT:}
  sms-limits:
    tenant-daily-new: ${APP_SMS_TENANT_DAILY_NEW:100}
    platform-daily: ${APP_SMS_PLATFORM_DAILY:1500}
    alert-email: ${APP_SMS_ALERT_EMAIL:}
  notifications:
    sms-provider: ${APP_SMS_PROVIDER:console}
    mail-provider: ${APP_MAIL_PROVIDER:console}
    mail-from: ${APP_MAIL_FROM:}
    # SMS göndərən adı (alfa-ad): bütün şirkətlər üçün bir; şirkətin adı mesajın mətnində olur
    sms-sender: ${APP_SMS_SENDER:TrendStamp}
    # Yalnız APP_SMS_PROVIDER=http olanda: real SMS provayderinin ünvanı və açarı
    sms-http:
      url: ${APP_SMS_HTTP_URL:}
      api-key: ${APP_SMS_HTTP_API_KEY:}
      timeout: 10s
    # Yalnız APP_SMS_PROVIDER=postaguvercini olanda: API ünvanı (yolsuz), PublicKey və PrivateKey
    posta-guvercini:
      url: ${APP_SMS_PG_URL:}
      public-key: ${APP_SMS_PG_PUBLIC_KEY:}
      private-key: ${APP_SMS_PG_PRIVATE_KEY:}
  customer-auth:
    otp-ttl: 5m
    otp-resend-cooldown: 60s
    otp-max-attempts: 5
    access-ttl: 15m
    refresh-ttl: 180d
  admin-auth:
    session-absolute: 8h
    session-idle: 30m
    step-up-validity: 10m
    password-reset-ttl: 30m
    invitation-ttl: 72h
    # Emaildəki linklər üçün (443 olarsa port göstərilmir)
    links-https-port: ${HTTPS_PORT:443}
  dev:
    simulator-enabled: false
    seed-enabled: false
  tenancy:
    db-host: ${DB_HOST:localhost}
    db-port: ${DB_PORT:5432}
    # Hər şirkətin bazasına ən çox neçə bağlantı (cəmi bağlantılar PostgreSQL max_connections-dan az olmalıdır)
    pool:
      max-size: ${APP_TENANT_POOL_MAX:3}
    platform:
      app-password: ${DB_PLATFORM_APP_PASSWORD:}
      owner-password: ${DB_PLATFORM_OWNER_PASSWORD:}
    provisioner:
      password: ${DB_PROVISIONER_PASSWORD:}
  crypto:
    keks: ${APP_CRYPTO_KEKS:}
    active-kek-id: ${APP_CRYPTO_ACTIVE_KEK_ID:}
    phone-hmac-key: ${APP_PHONE_HMAC_KEY:}
    otp-pepper: ${APP_OTP_PEPPER:}
    redemption-code-key: ${APP_REDEMPTION_CODE_KEY:}
