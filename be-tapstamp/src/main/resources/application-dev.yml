# Yalnız lokal inkişaf mühiti. Prod-da bu profil aktiv olarsa tətbiq başlamır (ProdSafetyGuard).
spring:
  config:
    # Docker-siz işə salanda sirlər layihənin kökündəki .env faylından oxunur (scripts/gen-secrets ilə yaradılır)
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    # *.localhost domenlərində HSTS brauzerin bütün localhost ünvanlarına təsir edir
    hsts-enabled: false
  dev:
    simulator-enabled: true
    seed-enabled: ${DEV_SEED_ENABLED:true}
    # Test hesablarının şifrəsi (README-də göstərilir). Yalnız dev profilində oxunur.
    seed-admin-password: ${DEV_SEED_ADMIN_PASSWORD:Kofe-Dev-Parol-2026}
    # Simulyasiya olunan çiplərin imza açarı (scripts/gen-secrets yaradır); boşdursa hər başlanğıcda təsadüfi
    simulator-key: ${APP_DEV_SIMULATOR_KEY:}
  # Lokalda bütün sorğular (E2E testləri, ekran görüntüsü skriptləri) bir IP-dən gəlir — yalnız IP üzrə limitlər
  # dev-də artırılır. Nömrə və email üzrə limitlər (kobud güc qorunması) dəyişmir; prod standart dəyərlərlə işləyir.
  rate-limits:
    admin-login-per-ip: 300
    otp-request-per-ip: 300
    otp-verify-per-ip: 600
    token-redeem-per-ip: 200

logging:
  level:
    az.tapstamp: DEBUG
    # SMS jurnalında nömrə açıqdır — MyBatis-in SQL parametrlərini loga yazmaması üçün (LogLeakIT)
    az.tapstamp.notification.sms.repository: INFO
