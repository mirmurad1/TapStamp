# CI: hər push və pull request-də backend və frontend yoxlanılır; asılılıq skanı həftəlik və PR-larda işləyir.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testlər)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be-tapstamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers inteqrasiya testləri runner-dəki Docker ilə işləyir
      - run: ./mvnw -B -ntp verify
      # OpenApiContractIT sənədi frontend-ə ixrac edir: commit olunmuş müqavilə köhnəlibsə, CI dayanır
      - name: OpenAPI müqaviləsi aktualdır
        run: git diff --exit-code -- ../fe-tapstamp/src/shared/api/openapi.json

  frontend:
    name: Frontend (lint + tip + testlər + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe-tapstamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fe-tapstamp/package-lock.json
      - run: npm ci --no-audit
      - name: TypeScript tipləri OpenAPI müqaviləsinə uyğundur
        run: npm run api:types && git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Asılılıqların təhlükəsizlik skanı
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: OWASP dependency-check + SBOM (CVSS >= 9 olarsa dayanır)
        working-directory: be-tapstamp
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -DskipTests -Psecurity-scan verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit (kritik)
        working-directory: fe-tapstamp
        run: npm audit --audit-level=critical

  images:
    name: Docker image-lərinin skanı (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Image-lərin qurulması
        run: |
          docker build -t tapstamp-backend:ci be-tapstamp
          docker build -t tapstamp-frontend:ci fe-tapstamp
          docker build -t tapstamp-nginx:ci infra/nginx
      # Öz image-lərimizdə yüksək və kritik zəiflik olarsa CI dayanır. postgres image-indəki gosu (Go stdlib)
      # nəticələri qəbul edilmiş riskdir (docs/security-review.md), ona görə o, skan olunmur.
      - name: Trivy
        run: |
          for image in tapstamp-backend:ci tapstamp-frontend:ci tapstamp-nginx:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
              --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
