# Lokal inkişaf üçün əlavə (yalnız dev):
#  * PostgreSQL — backend-i IDE-dən (Docker-siz) işə salanda qoşulmaq üçün;
#  * backend — Vite dev serverinin proxy-si üçün (http://mockcoffee.localhost:5173 → 127.0.0.1:8080).
# İstifadə: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Portlar yalnız 127.0.0.1-də açılır (xarici şəbəkədən əlçatan deyil).
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - data
      - devdb

  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

networks:
  devdb:
