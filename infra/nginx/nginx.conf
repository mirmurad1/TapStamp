# Kənar (edge) nginx: TLS, təhlükəsizlik başlıqları, marşrutlaşdırma və kənar rate limit qatı.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    # API-yə böyük body göndərilmir; daha böyük sorğular 413 alır
    client_max_body_size 64k;

    # Logda sorğu parametrləri (məs. toxunuşun picc/cmac dəyərləri) yazılmır — yalnız yol
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                    'host=$host rid=$request_id rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Kənar rate limit (əsas, daha dəqiq limitlər backend-dədir)
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=tap_per_ip:10m rate=1r/s;
    limit_req_status 429;

    # Toxunuş URL-ləri heç vaxt Referer ilə başqa sayta ötürülmür
    map $uri $referrer_policy {
        ~^/t/    "no-referrer";
        ~^/tap/  "no-referrer";
        default  "strict-origin-when-cross-origin";
    }

    # Kamera yalnız admin panelində (işçinin QR skaneri) icazəlidir
    map $uri $permissions_policy {
        ~^/admin "camera=(self), microphone=(), geolocation=(), payment=(), usb=()";
        default  "camera=(), microphone=(), geolocation=(), payment=(), usb=()";
    }

    # Yalnız şablondan yaradılan konfiqurasiya (image-dəki standart default.conf istifadə olunmur)
    include /etc/nginx/conf.d/app.conf;
}
