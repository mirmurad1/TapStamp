# TLS: sertifikat SNI adına görə seçilir (certs/<domen>/fullchain.pem). Sertifikatı olmayan domenlə TLS
# bağlantısı qurulmur (fail closed). Şirkət domenləri və şirkət saytı eyni qaydanı istifadə edir.
ssl_certificate     /etc/nginx/certs/$ssl_server_name/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/$ssl_server_name/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HTTP Host başlığı TLS SNI ilə eyni olmalıdır: bir domenin bağlantısı üzərindən
# başqa şirkətin domeninə sorğu göndərmək mümkün olmasın
if ($host != $ssl_server_name) {
    return 421;
}
