# Backend-ə proxy. Host başlığı saxlanılır: backend tenant-ı domenə görə müəyyən edir.
proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
# Konteynerə qoşulmaq alınmasa (məs. deploy zamanı dayanır), sorğu upstream-dəki digər konteynerə ötürülür.
# Göndərilmiş POST təkrar edilmir (nginx standartı) — möhür iki dəfə yazılmaz.
proxy_next_upstream error timeout http_502;
proxy_next_upstream_tries 2;
