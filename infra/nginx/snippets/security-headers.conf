# SPA (HTML və statik fayllar) üçün təhlükəsizlik başlıqları. API cavablarının başlıqlarını backend özü qoyur.
# CSP: inline skript və eval qadağandır; bütün resurslar yalnız öz domenimizdən yüklənir.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $referrer_policy always;
add_header Permissions-Policy $permissions_policy always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
